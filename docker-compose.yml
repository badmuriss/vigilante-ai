services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: vigilante
      POSTGRES_PASSWORD: vigilante_dev
      POSTGRES_DB: vigilante
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vigilante -d vigilante"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      network: host
    ports:
      - "8000:8000"
    environment:
      - VIGILANTE_CAMERA_INDEX=0
      - VIGILANTE_DATABASE_URL=postgresql+psycopg2://vigilante:vigilante_dev@postgres:5432/vigilante
      - VIGILANTE_BLOB_STORAGE_PATH=/data/alerts
      - VIGILANTE_RETRAINING_EXPORT_PATH=/data/feedback
      - VIGILANTE_NOTIFY_ENCRYPTION_KEY=${VIGILANTE_NOTIFY_ENCRYPTION_KEY:-}
      - VIGILANTE_WHATSAPP_API_BASE=${VIGILANTE_WHATSAPP_API_BASE:-https://graph.facebook.com/v22.0}
      - VIGILANTE_WHATSAPP_HTTP_TIMEOUT=${VIGILANTE_WHATSAPP_HTTP_TIMEOUT:-10.0}
      - VIGILANTE_WHATSAPP_DISPATCH_WORKERS=${VIGILANTE_WHATSAPP_DISPATCH_WORKERS:-4}
      # Single shared platform Meta number (global, not per-tenant).
      - VIGILANTE_WHATSAPP_PHONE_NUMBER_ID=${VIGILANTE_WHATSAPP_PHONE_NUMBER_ID:-}
      - VIGILANTE_WHATSAPP_ACCESS_TOKEN=${VIGILANTE_WHATSAPP_ACCESS_TOKEN:-}
      - VIGILANTE_WHATSAPP_APP_SECRET=${VIGILANTE_WHATSAPP_APP_SECRET:-}
      - VIGILANTE_WHATSAPP_VERIFY_TOKEN=${VIGILANTE_WHATSAPP_VERIFY_TOKEN:-}
      - VIGILANTE_WHATSAPP_TEMPLATE_NAME=${VIGILANTE_WHATSAPP_TEMPLATE_NAME:-}
      - VIGILANTE_WHATSAPP_TEMPLATE_LANGUAGE=${VIGILANTE_WHATSAPP_TEMPLATE_LANGUAGE:-pt_BR}
      - VIGILANTE_PUBLIC_APP_URL=${VIGILANTE_PUBLIC_APP_URL:-https://vigilanteai.outis.com.br}
      - VIGILANTE_LOCAL_TIMEZONE=${VIGILANTE_LOCAL_TIMEZONE:-America/Sao_Paulo}
      - VIGILANTE_DEEPSEEK_API_KEY=${VIGILANTE_DEEPSEEK_API_KEY:-}
      - VIGILANTE_OPENROUTER_API_KEY=${VIGILANTE_OPENROUTER_API_KEY:-}
      - VIGILANTE_OPENAI_API_KEY=${VIGILANTE_OPENAI_API_KEY:-}
      - VIGILANTE_HF_TOKEN=${VIGILANTE_HF_TOKEN:-}
      - VIGILANTE_LLM_MODEL=${VIGILANTE_LLM_MODEL:-deepseek-v4-pro}
      - VIGILANTE_EMBEDDING_MODEL=${VIGILANTE_EMBEDDING_MODEL:-text-embedding-3-small}
      - VIGILANTE_KB_SEED_ON_STARTUP=${VIGILANTE_KB_SEED_ON_STARTUP:-1}
    group_add:
      - "44"  # video group for camera access
    devices:
      - /dev/video0:/dev/video0
    volumes:
      - alerts_data:/data/alerts
      # Bind-mount so admin feedback exports show up directly under
      # ml/data/feedback for the merge_feedback.sh helper.
      - ./ml/data/feedback:/data/feedback
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      network: host
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=
      - NEXT_BACKEND_INTERNAL_URL=http://backend:8000
    depends_on:
      - backend

  # ---- RTSP test stack (profile: rtsp) ----
  # Sobe MediaMTX server + ffmpeg-loop que transmite MP4s da pasta ./media
  # como streams RTSP, simulando câmeras IP reais.
  #
  # Subir só esse stack:
  #   docker compose --profile rtsp up -d
  # Subir tudo (app + RTSP):
  #   docker compose --profile rtsp up -d
  #
  # Cada arquivo em ./media/<nome>.mp4 vira um stream rtsp://localhost:8554/<nome>
  mediamtx:
    image: bluenviron/mediamtx:latest
    profiles: ["rtsp"]
    restart: unless-stopped
    ports:
      - "8554:8554"   # RTSP
      - "8888:8888"   # HLS (debug no browser: http://localhost:8888/<stream>/index.m3u8)
      - "9997:9997"   # API REST (status)
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro

  ffmpeg-loop:
    image: jrottenberg/ffmpeg:7-alpine
    profiles: ["rtsp"]
    restart: unless-stopped
    depends_on:
      - mediamtx
    volumes:
      - ./media:/media:ro
      - ./scripts/ffmpeg-loop.sh:/loop.sh:ro
    entrypoint: ["/bin/sh", "/loop.sh"]
    environment:
      - MEDIAMTX_HOST=mediamtx
      - MEDIAMTX_PORT=8554
      - MEDIA_DIR=/media
      - SEEK_SECONDS=${SEEK_SECONDS:-0}
      - ACTIVE_VIDEO=${ACTIVE_VIDEO:-}

  # Stable public webhook tunnel (profile: tunnel)
  #
  # Use a named Cloudflare Tunnel with a public hostname configured in
  # Cloudflare Zero Trust:
  #   https://vigilanteai.outis.com.br -> http://frontend:3000
  #
  # The frontend proxies /api/* to http://backend:8000 through Next rewrites, so
  # the same public hostname serves the app, API, camera frames and webhooks.
  #
  # Then set CLOUDFLARED_TOKEN in .env and run:
  #   docker compose --profile rtsp --profile tunnel up -d
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARED_TOKEN}
    depends_on:
      - frontend

volumes:
  postgres_data:
  alerts_data:
