# Vigilante.AI — PPE training config v2 (CCTV small-object regime).
#
# THIS IS NOT A DATA YAML. Unlike ml/configs/ppe-cctv-v1.yaml, this is a full
# Ultralytics override file, consumed with `yolo cfg=...`. It has to be, because
# ml/train.py exposes no flag for scale / close_mosaic / lr / patience / optimizer,
# which are exactly the knobs that decide this run. The dataset it points at is
# the one merge_datasets.py writes (absolute `path:`, 4-class names).
#
# Launch (nothing else needed):
#   /home/badmuriss/Documents/vigilante-ai/backend/.venv/bin/yolo \
#     cfg=/home/badmuriss/Documents/vigilante-ai/ml/configs/ppe-cctv-v2.yaml
#
# Rationale for every value: ml/TRAINING_PLAN.md. Measured, not guessed.

task: detect
mode: train

# --- data / model -----------------------------------------------------------
data: /home/badmuriss/Documents/vigilante-ai/ml/datasets/merged4/data.yaml

# yolov8s + P2 (stride-4) head. Deployment helmets are ~10-25 px; at stride 8 a
# 12 px box owns ~1.5x1.5 cells, at stride 4 it owns ~3x3. Measured CPU cost of
# the extra head at 960: 679 ms vs 637 ms for plain yolov8s (+6.6%). yolov8m
# costs +82% (1163 ms) for capacity in the wrong dimension.
model: yolov8s-p2.yaml

# COCO weights, not backend/best.pt. Measured: both transfer the identical 5.83M
# params (100% of backbone, 0% of the re-indexed p2 neck/head) — best.pt offers
# no structural advantage and carries 50 epochs of frontal-Roboflow scale bias.
pretrained: /home/badmuriss/Documents/vigilante-ai/ml/weights/yolov8s.pt

# --- resolution / batch -----------------------------------------------------
# 960 = backend settings.MODEL_INPUT_SIZE (already 960) = native width of the
# webcam_raw frames (960x720). v1 trained at 640 and shipped inference at 960:
# a scale mismatch on top of the small-object problem. Measured peak VRAM for
# yolov8s-p2 @960 b12 = 8722 MiB of 11411 MiB free.
imgsz: 960
batch: 12
multi_scale: false # would peak at 1440px -> OOM; `scale` below does the same job
rect: false

# --- schedule ---------------------------------------------------------------
epochs: 120 # ~11 min/epoch GPU compute measured (40.1 img/s, 26k imgs)
patience: 25
optimizer: SGD # pinned: ultralytics 8.4 `auto` now selects MuSGD above 10k iters
lr0: 0.01
lrf: 0.01
cos_lr: true
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 5.0 # long: 45% of the net (p2 neck+head) starts random
warmup_momentum: 0.8
warmup_bias_lr: 0.1
nbs: 64

# --- loss -------------------------------------------------------------------
box: 7.5
cls: 1.0 # up from 0.5: helmet/head and vest/no_vest are co-located and differ
dfl: 1.5 #   only by appearance, so the task is now discrimination-limited

# --- augmentation -----------------------------------------------------------
# The whole point: manufacture 10-25 px objects out of frontal close-up sources.
scale: 0.9 # random_perspective uses uniform(1-s, 1+s) -> 0.1x..1.9x
mosaic: 1.0 # tiles 4 images into one canvas, i.e. a free small-object generator
close_mosaic: 20 # last 20 epochs on clean frames: mosaic box stats != real stats
translate: 0.2 # workers clipped by frame edges
perspective: 0.001 # 2x v1: the actual domain gap is frontal vs high-mounted
degrees: 3.0 # mast-camera install tilt only; 10 deg is unphysical and inflates
shear: 0.0 #   axis-aligned boxes on standing people
fliplr: 0.5
flipud: 0.0 # gravity does not flip
hsv_h: 0.015 # KEEP TINY: hi-vis hue is the entire vest/no_vest signal
hsv_s: 0.7
hsv_v: 0.5 # harsh outdoor sun/shadow

# Deliberate zeros — verified no-ops or actively harmful here:
mixup: 0.0 # blends a 12 px helmet into background haze
cutmix: 0.0
copy_paste: 0.0 # augment.py returns early when instances.segments is empty; our
#                 labels are boxes only, so any value is a silent no-op
erasing: 0.0 # classify_augmentations only; v1's erasing=0.4 did nothing
auto_augment: randaugment # ditto, classification-only; left at default
bgr: 0.0

# --- run bookkeeping --------------------------------------------------------
project: /home/badmuriss/Documents/vigilante-ai/ml/runs/train
name: ppe-cctv-v2
device: 0
workers: 8
seed: 42
deterministic: true
amp: true
cache: false
val: true
plots: true
save: true
save_period: 10 # a 20h run should survive a crash
